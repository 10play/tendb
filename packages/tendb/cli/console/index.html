<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#161616" />
    <title>tendb console</title>
    <!-- Favicon: the 10play mark (see components/TenDBLogo.tsx — keep in sync). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 21 20'%3E%3Cpath fill='%2300a06f' d='m13.153 10.682-2.343 3.91c-1.167 1.949.233 4.43 2.5 4.43h4.687c2.268 0 3.668-2.481 2.5-4.43l-2.342-3.91c-1.133-1.891-3.868-1.891-5 0zM1.705 18.427C.075 17.52-.484 15.513.457 13.943L7.27 2.57C8.213.999 10.3.46 11.933 1.368c1.63.907 2.189 2.914 1.248 4.485l-6.814 11.37c-.942 1.573-3.03 2.112-4.662 1.204'/%3E%3C/svg%3E"
    />
    <script>
      // Set the theme class before first paint so the page never flashes the
      // wrong palette. Mirrors ThemeProvider; the key lives in lib/storage.ts.
      (function () {
        var dark = true;
        try {
          var raw = window.localStorage.getItem("tendb.console.theme");
          var mode = raw ? JSON.parse(raw) : "system";
          if (mode !== "light" && mode !== "dark") mode = "system";
          dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (error) {
          // Storage blocked or unparseable — fall back to the dark default.
        }
        document.documentElement.classList.add(dark ? "dark" : "light");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#161616" : "#fafafa");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
